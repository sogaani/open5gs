apiVersion: v1
kind: Service
metadata:
  name: {{ include "open5gs.component" (dict "ctx" . "name" "mongodb") }}
  labels:
    {{- include "open5gs.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  type: ClusterIP
  selector:
    {{- include "open5gs.selector" (dict "ctx" . "name" "mongodb") | nindent 4 }}
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
