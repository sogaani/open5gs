{{- if and .Values.roaming.enabled .Values.roaming.sepp.tls.cert }}
# TLS material for N32 (only when the PEMs are passed in values; otherwise
# roaming.sepp.tls.existingSecret is used as is).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open5gs.component" (dict "ctx" . "name" "sepp-tls") }}
  labels:
    {{- include "open5gs.labels" . | nindent 4 }}
    app.kubernetes.io/component: sepp
type: Opaque
data:
  ca.crt: {{ required "roaming.sepp.tls.ca is required together with cert/key" .Values.roaming.sepp.tls.ca | b64enc }}
  tls.crt: {{ .Values.roaming.sepp.tls.cert | b64enc }}
  tls.key: {{ required "roaming.sepp.tls.key is required together with cert" .Values.roaming.sepp.tls.key | b64enc }}
{{- end }}
