apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open5gs.component" (dict "ctx" . "name" "nssf") }}
  labels:
    {{- include "open5gs.labels" . | nindent 4 }}
    app.kubernetes.io/component: nssf
data:
  nssf.yaml: |
    {{- include "open5gs.configHeader" . | nindent 4 }}
    nssf:
      sbi:
        {{- include "open5gs.sbiServer" (dict "ctx" . "name" "nssf") | nindent 8 }}
        {{- include "open5gs.sbiClientScp" (dict "ctx" .) | nindent 8 }}
          nsi:
            {{- range .Values.slices }}
            - uri: {{ include "open5gs.nrfUri" $ }}
              s_nssai:
                sst: {{ .sst }}
                {{- if .sd }}
                sd: {{ .sd | quote }}
                {{- end }}
            {{- end }}
