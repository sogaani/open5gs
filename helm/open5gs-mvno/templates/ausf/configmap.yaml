apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open5gs.component" (dict "ctx" . "name" "ausf") }}
  labels:
    {{- include "open5gs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ausf
data:
  ausf.yaml: |
    {{- include "open5gs.configHeader" . | nindent 4 }}
    ausf:
      sbi:
        {{- include "open5gs.sbiServer" (dict "ctx" . "name" "ausf") | nindent 8 }}
        {{- include "open5gs.sbiClientScp" (dict "ctx" .) | nindent 8 }}
