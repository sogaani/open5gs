apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open5gs.component" (dict "ctx" . "name" "pcf") }}
  labels:
    {{- include "open5gs.labels" . | nindent 4 }}
    app.kubernetes.io/component: pcf
data:
  pcf.yaml: |
    db_uri: {{ include "open5gs.mongoUri" . }}
    {{- include "open5gs.configHeader" . | nindent 4 }}
    pcf:
      sbi:
        {{- include "open5gs.sbiServer" (dict "ctx" . "name" "pcf") | nindent 8 }}
        {{- include "open5gs.sbiClientScp" (dict "ctx" .) | nindent 8 }}
      metrics:
        server:
          - address: __POD_IP__
            port: 9090
      {{- if .Values.roaming.enabled }}
      # Local policy for roaming subscribers (no UDR data for them in this PLMN)
      policy:
        {{- include "open5gs.roamingPcfPolicy" . | trim | nindent 8 }}
      {{- end }}
