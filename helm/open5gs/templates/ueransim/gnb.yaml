{{- if .Values.ueransim.enabled }}
{{- $root := . }}
{{- $amfNgap := include "open5gs.fqdn" (dict "ctx" . "name" "amf-ngap") }}
{{- range $g := .Values.ueransim.gnbs }}
{{- $name := printf "gnb-%s" $g.name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open5gs.component" (dict "ctx" $root "name" $name) }}
  labels:
    {{- include "open5gs.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
data:
  # UERANSIM 3.3.0 resolves FQDNs (amfConfigs), but its interface-name
  # support is broken (TryResolveHost() blanks the value before the
  # interface lookup), so the pod IP is substituted at start instead.
  gnb.yaml: |
    mcc: '{{ $root.Values.plmn.mcc }}'
    mnc: '{{ $root.Values.plmn.mnc }}'
    nci: '{{ $g.nci }}'
    idLength: {{ $g.idLength | default 32 }}
    tac: {{ $g.tac | default $root.Values.tac }}
    linkIp: __POD_IP__
    ngapIp: __POD_IP__
    gtpIp: __POD_IP__
    amfConfigs:
      - address: {{ $amfNgap }}
        port: 38412
    slices:
      {{- include "open5gs.snssaiList" $root | trim | nindent 6 }}
    ignoreStreamIds: true
    cellAccessType: nr
  entrypoint.sh: |
    set -e
    # The AMF N2 Service is headless, so its record only exists once the AMF
    # pod is ready. nr-gnb resolves the name once at startup, so wait for it.
    until getent hosts {{ $amfNgap }} >/dev/null; do
      echo "waiting for AMF ({{ $amfNgap }})"; sleep 3
    done
    sed "s/__POD_IP__/${POD_IP}/g" /config/gnb.yaml > /tmp/gnb.yaml
    echo "gNB=${POD_IP} AMF={{ $amfNgap }}"
    exec nr-gnb -c /tmp/gnb.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open5gs.component" (dict "ctx" $root "name" $name) }}
  labels:
    {{- include "open5gs.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: 1
  # One cell per gNB: never run old and new pods behind the same Service.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "open5gs.selector" (dict "ctx" $root "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "open5gs.selector" (dict "ctx" $root "name" $name) | nindent 8 }}
      annotations:
        checksum/config: {{ print $g $root.Values.plmn $root.Values.tac $root.Values.slices | sha256sum }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gnb
          image: "{{ $root.Values.ueransim.image.repository }}:{{ $root.Values.ueransim.image.tag }}"
          imagePullPolicy: {{ $root.Values.ueransim.image.pullPolicy }}
          command: ["/bin/sh", "/config/entrypoint.sh"]
          env:
            {{- include "open5gs.podIpEnv" $root | nindent 12 }}
          ports:
            - name: rls
              containerPort: 4997
              protocol: UDP
            - name: gtpu
              containerPort: 2152
              protocol: UDP
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "ss -lun | grep -q ':4997'"]
            initialDelaySeconds: 5
            periodSeconds: 5
          # UERANSIM never reconnects after the SCTP association to the AMF is
          # lost (e.g. the AMF pod was replaced); it just drops the AMF context
          # and every later UE fails with "Could not find a suitable AMF".
          # Restart the pod when nr-cli reports no AMF context.
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "nr-cli $(nr-cli --dump | head -1) -e amf-list | grep -q 'id:'"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            {{- toYaml ($g.resources | default dict) | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "open5gs.component" (dict "ctx" $root "name" $name) }}
---
# Stable address for the radio link simulation (UDP 4997). UEs put this
# Service's FQDN in gnbSearchList, so a replaced gNB pod is picked up again.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open5gs.component" (dict "ctx" $root "name" $name) }}
  labels:
    {{- include "open5gs.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  {{- with $g.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector:
    {{- include "open5gs.selector" (dict "ctx" $root "name" $name) | nindent 4 }}
  ports:
    - name: rls
      port: 4997
      targetPort: 4997
      protocol: UDP
{{- end }}
{{- end }}
