{{- $ports := list (dict "name" "metrics" "port" 9090 "protocol" "TCP") -}}
{{- include "open5gs.nfService" (dict "ctx" . "name" "amf" "extraPorts" $ports) }}
---
# Headless Service for N2: the gNB resolves this name to the AMF pod IP and
# opens SCTP directly to the pod, so no SCTP load balancing is needed.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open5gs.component" (dict "ctx" . "name" "amf-ngap") }}
  labels:
    {{- include "open5gs.labels" . | nindent 4 }}
    app.kubernetes.io/component: amf
spec:
  clusterIP: None
  selector:
    {{- include "open5gs.selector" (dict "ctx" . "name" "amf") | nindent 4 }}
  ports:
    - name: ngap
      port: 38412
      targetPort: 38412
      protocol: SCTP
