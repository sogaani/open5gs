apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open5gs.component" (dict "ctx" . "name" "udm") }}
  labels:
    {{- include "open5gs.labels" . | nindent 4 }}
    app.kubernetes.io/component: udm
data:
  udm.yaml: |
    {{- include "open5gs.configHeader" . | nindent 4 }}
    udm:
      # Home-network keys for SUCI de-concealment, shipped inside the image
      hnet:
        - id: 1
          scheme: 1
          key: /usr/local/etc/open5gs/hnet/curve25519-1.key
        - id: 2
          scheme: 2
          key: /usr/local/etc/open5gs/hnet/secp256r1-2.key
        - id: 3
          scheme: 1
          key: /usr/local/etc/open5gs/hnet/curve25519-3.key
        - id: 4
          scheme: 2
          key: /usr/local/etc/open5gs/hnet/secp256r1-4.key
        - id: 5
          scheme: 1
          key: /usr/local/etc/open5gs/hnet/curve25519-5.key
        - id: 6
          scheme: 2
          key: /usr/local/etc/open5gs/hnet/secp256r1-6.key
      sbi:
        {{- include "open5gs.sbiServer" (dict "ctx" . "name" "udm") | nindent 8 }}
        {{- include "open5gs.sbiClientScp" (dict "ctx" .) | nindent 8 }}
