{{- $root := . }}
{{- $ports := list (dict "name" "pfcp" "port" 8805 "protocol" "UDP") (dict "name" "metrics" "port" 9090 "protocol" "TCP") }}
{{- range $d := .Values.dnns }}
{{- $name := printf "smf-%s" $d.name }}
---
{{ include "open5gs.nfService" (dict "ctx" $root "name" $name "extraPorts" $ports) }}
{{- end }}
