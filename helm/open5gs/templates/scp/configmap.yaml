apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open5gs.component" (dict "ctx" . "name" "scp") }}
  labels:
    {{- include "open5gs.labels" . | nindent 4 }}
    app.kubernetes.io/component: scp
data:
  scp.yaml: |
    {{- include "open5gs.configHeader" . | nindent 4 }}
    scp:
      sbi:
        {{- include "open5gs.sbiServer" (dict "ctx" . "name" "scp") | nindent 8 }}
        client:
          nrf:
            - uri: {{ include "open5gs.nrfUri" . }}
