# ---------------------------------------------------------------------------
# Images
# ---------------------------------------------------------------------------
image:
  repository: ghcr.io/sogaani/ubuntu-latest-open5gs-build
  tag: sogaani-test
  # use "Always" for development, as sogaani-test is a moving target.
  pullPolicy: Always

# Secrets for pulling private images from ghcr.io, e.g. [{ name: ghcr-pull }]
imagePullSecrets: []

# Kubernetes cluster DNS domain
clusterDomain: cluster.local

# Open5GS log level: trace|debug|info|warn|error
logLevel: info

# ---------------------------------------------------------------------------
# Network identity
# ---------------------------------------------------------------------------
plmn:
  mcc: "999"
  mnc: "70"
tac: 1

amf:
  region: 2
  set: 1
  name: open5gs-amf0
  networkName:
    full: Open5GS
    short: Next

# Slices served by the network (AMF plmn_support, NSSF, gNB, SMF info)
slices:
  - sst: 1
    # sd: "000001"
  - sst: 2

# ---------------------------------------------------------------------------
# Data networks: one entry per (DNN, optional S-NSSAI). Every entry gets its
# own SMF and UPF pair. Each SMF advertises only its DNN to the NRF, so the AMF
# selects the SMF by S-NSSAI + DNN, like an MVNO SMF/UPF attached to an MNO core.
#   - without sst: smf-<dnn> / upf-<dnn>, SmfInfo lists every entry of slices[]
#   - with sst:    smf-<dnn>-sst<N>[-sd<hex>] / upf-..., SmfInfo lists only that
#                  S-NSSAI (it must appear in slices[]), so the same DNN name can
#                  be served by different SMF/UPF pairs per slice.
# Open5GS cannot split UPFs by S-NSSAI inside one SMF (it matches UPFs by dnn,
# tac and cell id only), which is why the split happens at the SMF.
# UE subnets must not overlap the pod CIDR, the service CIDR or the node LAN,
# and should be distinct per entry (the BSF keys PCF bindings by UE IPv4 only).
# ---------------------------------------------------------------------------
dnns:
  - name: internet
    subnet: 10.45.0.0/16
    gateway: 10.45.0.1
    sst: 1
    # sst: 1            # serve this DNN only for S-NSSAI sst 1 (names become *-internet-sst1)
    # sd: "000001"      # optional, together with sst
    # nodeSelector: { kubernetes.io/hostname: node-a }   # pin this DNN's SMF and UPF to a node
    # epc: false        # with epc.enabled, the first entry per DNN name is also the 4G APN
                        # (its SMF/UPF act as PGW-C/PGW-U); set false to skip this entry
  - name: internet    # same DNN name, different slice -> separate SMF/UPF (smf-internet-sst2)
    sst: 2
    subnet: 10.46.0.0/16
    gateway: 10.46.0.1
  - name: ims
    subnet: 10.47.0.0/16
    gateway: 10.47.0.1
  # - name: internet    # same DNN name, different slice -> separate SMF/UPF (smf-internet-sst2)
  #   sst: 2
  #   subnet: 10.46.0.0/16
  #   gateway: 10.46.0.1
  # - name: ims
  #   subnet: 10.47.0.0/16
  #   gateway: 10.47.0.1

dns:
  - 8.8.8.8
  - 8.8.4.4
mtu: 1400

# ---------------------------------------------------------------------------
# Subscribers written to MongoDB by a post-install Job (skipped if the IMSI
# already exists). Defaults match the UERANSIM sample UE.
# ---------------------------------------------------------------------------
subscribers:
  - imsi: "999700000000001"
    key: "465B5CE8B199B49FAA5F0A2EE238A6BC"
    opc: "E8ED289DEBA952E4283B54E88E6183CA"
    amf: "8000"
    sst: 1
    dnn: internet
    # ipv4: 10.45.0.2   # optional static UE address inside the DNN subnet
  - imsi: "999700000000002"
    key: "465B5CE8B199B49FAA5F0A2EE238A6BD"
    opc: "E8ED289DEBA952E4283B54E88E6183CA"
    amf: "8000"
    sst: 2
    dnn: internet
  - imsi: "999700000000003"
    key: "465B5CE8B199B49FAA5F0A2EE238A6BF"
    opc: "E8ED289DEBA952E4283B54E88E6183CA"
    amf: "8000"
    sst: 1
    dnn: ims

# ---------------------------------------------------------------------------
# MongoDB
# ---------------------------------------------------------------------------
mongodb:
  image: mongo:7
  persistence:
    enabled: true
    size: 2Gi
    storageClass: longhorn
  resources: {}

# ---------------------------------------------------------------------------
# WebUI (subscriber management). Exposed with a LoadBalancer by default.
# ---------------------------------------------------------------------------
webui:
  image:
    repository: ghcr.io/sogaani/open5gs-webui
    tag: sogaani-test
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 9999
    # Address from the Cilium LB-IPAM pool. Set to "" to let the pool choose.
    loadBalancerIP: 172.31.254.20
  resources: {}

# ---------------------------------------------------------------------------
# UERANSIM gNB and UE simulator (runs inside the cluster)
# ---------------------------------------------------------------------------
ueransim:
  enabled: true
  image:
    repository: ghcr.io/sogaani/ueransim
    tag: sogaani-test
    pullPolicy: Always
  # One gNB Deployment + ClusterIP Service per entry. UEs reach the gNB
  # through the Service FQDN, so the gNB pod can be replaced without
  # changing anything on the UE side. Each gNB needs a distinct nci.
  gnbs:
    - name: gnb1
      nci: "0x000000010"
      idLength: 32
      # tac: 1                 # defaults to .Values.tac
      # clusterIP: 10.96.100.10  # fixed ClusterIP inside the Service CIDR; "" lets k8s choose
      clusterIP: "192.96.0.31"
      # nodeSelector: {}
      resources: {}
    - name: gnb2
      nci: "0x000000020"
      idLength: 32
      # tac: 1                 # defaults to .Values.tac
      # clusterIP: 10.96.100.10  # fixed ClusterIP inside the Service CIDR; "" lets k8s choose
      clusterIP: "192.96.0.32"
      # nodeSelector: {}
      resources: {}
  ues:
    - name: ue1
      imsi: "999700000000001"
      key: "465B5CE8B199B49FAA5F0A2EE238A6BC"
      opc: "E8ED289DEBA952E4283B54E88E6183CA"
      amf: "8000"
      imei: "356938035643803"
      sst: 1
      dnn: internet
      gnbs: [gnb1]
      # gnbs: [gnb1]           # gNBs to put in gnbSearchList; defaults to all gnbs
    - name: ue2
      imsi: "999700000000002"
      key: "465B5CE8B199B49FAA5F0A2EE238A6BD"
      opc: "E8ED289DEBA952E4283B54E88E6183CA"
      amf: "8000"
      imei: "356938035643804"
      sst: 2
      dnn: internet
      gnbs: [gnb2]
    - name: ue3
      imsi: "999700000000003"
      key: "465B5CE8B199B49FAA5F0A2EE238A6BF"
      opc: "E8ED289DEBA952E4283B54E88E6183CA"
      amf: "8000"
      imei: "356938035643805"
      sst: 1
      dnn: ims
      gnbs: [gnb1,gnb2]

  ueResources: {}

# ---------------------------------------------------------------------------
# Per-NF resources (optional)
# ---------------------------------------------------------------------------
resources: {}

# ---------------------------------------------------------------------------
# Roaming (SEPP / N32). Off by default: nothing below changes the rendering
# until roaming.enabled is true. See README "Roaming" and values-roaming.yaml.
#
# With roaming on, the NFs in fqdnNfs and every SMF advertise the 3GPP FQDN
# <component>.5gc.mnc<MNC>.mcc<MCC>.3gppnetwork.org:7777 instead of their
# Service name. Open5GS routes a request to the SEPP only when the target is
# such an FQDN of another PLMN, and resolves it at startup, so each of those
# Services gets a pinned ClusterIP and every NF pod gets matching hostAliases.
# dnns[].clusterIP is therefore required when roaming is enabled.
# ---------------------------------------------------------------------------
roaming:
  enabled: false
  # component -> pinned ClusterIP (inside the Service CIDR). A visited PLMN
  # needs nrf (and the SMFs via dnns[].clusterIP); a home PLMN also needs
  # ausf, udm and nssf so the visited AMF can reach them through the SEPP.
  fqdnNfs:
    nrf: 192.96.0.40
  # PLMNs reachable through our SEPP (their SEPP's N32 identity and ports).
  peers:
    - mcc: "999"
      mnc: "71"
      sepp:
        host: mvno-sepp.mvno.svc.cluster.local
        n32cPort: 7778
        n32fPort: 7779
      # 4G: Diameter identity of the home HSS (MME hss_map for IMSIs of this PLMN)
      # epc:
      #   hss: mvno-hss.mvno.svc.cluster.local
  sepp:
    # N32 identity sent in the N32-c handshake; the peer lists it as "receiver".
    # "" = this SEPP's own Service FQDN (<release>-sepp.<namespace>.svc.<domain>).
    sender: ""
    ports:
      n32c: 7778
      n32f: 7779
    tls:
      # Secret with ca.crt / tls.crt / tls.key (create it with helm/sepp-certs/make-certs.sh).
      # Alternatively pass the PEMs in ca/cert/key (e.g. --set-file) and the chart creates the Secret.
      existingSecret: sepp-tls
      ca: ""
      cert: ""
      key: ""
      # Mutual TLS on N32 (verify_client + client certificate)
      verifyClient: true
  pcf:
    # Local V-PCF policy entries for roaming subscribers (pcf.policy[] syntax, see
    # configs/open5gs/pcf.yaml.in). [] = one auto-generated entry per peer covering
    # every slice and DNN with QoS index 9 and 1 Gbps AMBR.
    policy: []

# ---------------------------------------------------------------------------
# 4G / EPC. Off by default. With epc.enabled the chart adds MME, HSS, SGW-C,
# SGW-U and PCRF; the SMF/UPF of the first dnns[] entry per DNN name also act
# as PGW-C/PGW-U for that APN (S5/S8-C, Gx). Subscribers are shared with 5G
# (the HSS reads slice[0].session[] as the APN list). Diameter identities are
# the Service FQDNs, the realm is the 3GPP one (TS 23.003 19.2); S6a/Gx run
# over TCP through the ClusterIP Services.
# ---------------------------------------------------------------------------
epc:
  enabled: false
  # Diameter realm of this PLMN; "" = epc.mnc<MNC>.mcc<MCC>.3gppnetwork.org
  realm: ""
  mme:
    name: open5gs-mme0
    gid: 2
    code: 1
  # Home PLMN only: write the PGW address (dnns[].clusterIP of the APN's SMF) into
  # every subscriber, so a visited MME learns the home PGW from the HSS (S8).
  pgwInHss: false
  diameter:
    # Inbound Diameter peers accepted by the HSS/PCRF besides this namespace
    # (acl_wl patterns), e.g. the visited MME's namespace on a home HSS.
    allowedPeers: []

# ---------------------------------------------------------------------------
# srsRAN_4G eNB + UE (ZMQ virtual radio), one pod per UE. Needs epc.enabled.
# ---------------------------------------------------------------------------
srsran:
  enabled: false
  image:
    repository: ghcr.io/sogaani/srsran-4g
    tag: sogaani-test
    pullPolicy: Always
  nPrb: 25
  # ZMQ sample rate; must be an integer multiple of the PHY rate (25 PRB: 5.76e6, 50: 11.52e6, 100: 23.04e6)
  baseSrate: "5.76e6"
  dlEarfcn: 3350
  logLevel: warning
  # Default resources for every pair (a 25 PRB pair needs about 1-2 CPUs)
  resources: {}
  ues:
    - name: lte1
      imsi: "999700000000001"
      key: "465B5CE8B199B49FAA5F0A2EE238A6BC"
      opc: "E8ED289DEBA952E4283B54E88E6183CA"
      apn: internet
      enbId: "0x19B"
      pci: 1
      # tac: 1, cellId: 1, dlEarfcn: 3350, imei: "353490069873319", resources: {}, nodeSelector: {}
